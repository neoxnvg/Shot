name: Build and publish web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-web
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish compiled files to web branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/web:refs/remotes/origin/web
          export GIT_DIR="$PWD/.git"
          export GIT_WORK_TREE="$PWD/dist"
          export GIT_INDEX_FILE="$RUNNER_TEMP/shot-web-index"
          cd dist
          git read-tree --empty
          git add --force --all .
          tree="$(git write-tree)"
          parent="$(git rev-parse refs/remotes/origin/web)"
          if [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$tree" -p "$parent" -m 'Update compiled game')"
          git push origin "$commit:refs/heads/web"
